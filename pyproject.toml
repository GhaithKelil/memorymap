[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorymap"
dynamic = ["version"]
description = "Live process memory forensics for Windows: secret scanning, injection anomalies and secret residue testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ghaith Kelil" }]
keywords = ["forensics", "memory", "security", "windows", "secrets", "dfir"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["psutil>=5.9", "flask>=3.0", "jinja2>=3.1", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memorymap = "memorymap.cli:main"

[project.urls]
Homepage = "https://github.com/GhaithKelil/memorymap"

[tool.setuptools.dynamic]
version = { attr = "memorymap.__version__" }

[tool.setuptools.packages.find]
include = ["memorymap*"]

[tool.setuptools.package-data]
memorymap = ["templates/*.html", "web/templates/*.html", "web/static/*.*", "web/static/img/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
